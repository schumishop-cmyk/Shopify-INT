query DeliveryInput {
  cart {
    lines {
      quantity
      merchandise {
        __typename
        ... on ProductVariant {
          product {
            vendor
          }
        }
      }
    }
    deliveryGroups {
      id
      deliveryOptions {
        handle
        cost {
          amount
        }
      }
    }
  }
  discount {
    discountClasses
    metafield(namespace: "$app:combined-shipping", key: "config") {
      value
    }
  }
}
