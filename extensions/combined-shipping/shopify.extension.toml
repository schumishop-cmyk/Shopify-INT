# Discount Function — kombinierte Versandkosten bei Bestellungen aus
# mehreren Standorten. Deploy: siehe README.md in diesem Verzeichnis.
# Auf 2026-07 gehoben, passend zur Admin-API (market-driven shipping). Die
# Discount-Function-API (cart.delivery-options.discounts.generate.run) ist
# zwischen 2026-01 und 2026-07 unverändert — Input/Output identisch.
api_version = "2026-07"

[[extensions]]
name = "Kombinierter Versand"
handle = "combined-shipping"
type = "function"
description = "Kombiniert Versandkosten, wenn eine Bestellung aus mehreren Standorten verschickt wird"

  [[extensions.targeting]]
  target = "cart.delivery-options.discounts.generate.run"
  input_query = "src/cart_delivery_options_discounts_generate_run.graphql"
  # kebab-case (WebAssembly Component Model) — der camelCase-JS-Export
  # cartDeliveryOptionsDiscountsGenerateRun wird automatisch darauf gemappt
  export = "cart-delivery-options-discounts-generate-run"

  [extensions.build]
  command = ""
  path = "dist/function.wasm"
  watch = ["src/**/*.js", "src/**/*.cjs"]
