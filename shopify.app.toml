# Shopify App-Konfiguration
# Docs: https://shopify.dev/docs/apps/build/cli-for-apps/app-configuration
#
# Änderungen an dieser Datei werden mit `shopify app deploy` als neue
# App-Version ins Partner Dashboard gepusht (dort erschien z.B. mybridge-2).

name = "Shipping Rules App"
client_id = "e8c2278c90acbdc6a401a9ec2c86c368"
application_url = "https://shopify-int-production.up.railway.app"
embedded = true

[access_scopes]
# write_discounts: legt den automatischen Rabatt an, der die
# Combined-Shipping-Function aktiviert
scopes = "write_shipping,write_discounts"
# Unser Server nutzt den klassischen OAuth-Flow (/auth/begin → /auth/callback),
# nicht Shopify managed installation
use_legacy_install_flow = true

[auth]
redirect_urls = [
  "https://shopify-int-production.up.railway.app/auth/callback"
]

# Die Sektion selbst ist Pflicht — aber bei use_legacy_install_flow = true
# dürfen KEINE [[webhooks.subscriptions]] darin stehen (sonst schlägt
# `shopify app deploy` fehl). Stattdessen:
#   - app/uninstalled wird pro Shop beim OAuth-Callback über die Admin-API
#     registriert (src/routes/auth.js)
#   - Die GDPR-Pflicht-Webhooks (customers/data_request, customers/redact,
#     shop/redact) werden im Dev Dashboard unter „Compliance webhooks"
#     eingetragen (URLs: /webhooks/customers/data_request, .../customers/redact,
#     .../shop/redact). Nötig für die App-Store-Einreichung.
[webhooks]
api_version = "2026-01"
