# Shopify App-Konfiguration
# Docs: https://shopify.dev/docs/apps/build/cli-for-apps/app-configuration
#
# Änderungen an dieser Datei werden mit `shopify app deploy` als neue
# App-Version ins Partner Dashboard gepusht (dort erschien z.B. mybridge-2).

name = "Shipping Rules App"
client_id = "e8c2278c90acbdc6a401a9ec2c86c368"
application_url = "https://shopify-int-production.up.railway.app"
embedded = true

[access_scopes]
scopes = "write_shipping"
# Unser Server nutzt den klassischen OAuth-Flow (/auth/begin → /auth/callback),
# nicht Shopify managed installation
use_legacy_install_flow = true

[auth]
redirect_urls = [
  "https://shopify-int-production.up.railway.app/auth/callback"
]

[webhooks]
api_version = "2024-01"

  # Wird für alle installierenden Shops automatisch abonniert
  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "https://shopify-int-production.up.railway.app/webhooks/app/uninstalled"

  # GDPR-Pflicht-Webhooks — nur hier oder im Partner Dashboard konfigurierbar,
  # nicht über die Admin API
  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request"]
  uri = "https://shopify-int-production.up.railway.app/webhooks/customers/data_request"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/redact"]
  uri = "https://shopify-int-production.up.railway.app/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  compliance_topics = ["shop/redact"]
  uri = "https://shopify-int-production.up.railway.app/webhooks/shop/redact"
